# C# 模板配置草案；模板将在后续迁移中拆分，当前尚未实现。
# 所有路径相对于 templates/csharp/。
# 配置只说明“代码的哪一部分由哪个 .tpl 文件生成”。
# message/enum 每个类型生成一份；编解码按 From / To 各生成一份，包含相关辅助方法。

# 同一个文件包含写类型、读类型、Tags 和现有 Wrapper 的声明。
message: types/message.cs.tpl
enum: types/enum.cs.tpl

json:
  FromJSON: methods/FromJSON.cs.tpl
  ToJSON: methods/ToJSON.cs.tpl

protobuf:
  # 包含 FromProtobuf 及解码辅助方法。
  FromProtobuf: methods/FromProtobuf.cs.tpl
  # 包含 ToProtobuf、ProtobufSize 及编码辅助方法。
  ToProtobuf: methods/ToProtobuf.cs.tpl

# 是否为某个 message 生成 YAML / URL Values，沿用 proto 注解及引用传播规则。
yaml:
  FromYAML: methods/FromYAML.cs.tpl
  ToYAML: methods/ToYAML.cs.tpl

url_values:
  FromURLValues: methods/FromURLValues.cs.tpl
  ToURLValues: methods/ToURLValues.cs.tpl

lifecycle:
  # 同时生成写类型和读类型的 Reset 方法，放在同一个文件。
  Reset: methods/Reset.cs.tpl
  Clone: methods/Clone.cs.tpl

# tests / benchmarks 仍由命令行开关启用。
# 键为输出相对路径；{message} 每个类型展开一次，无占位符的文件只生成一次。
tests:
  "Tests/{message}.Tests.cs": tests/message.Tests.cs.tpl
  Tests/TestSupport.cs: tests/TestSupport.cs.tpl

benchmarks:
  "Benchmarks/{message}.Benchmarks.cs": benchmarks/message.Benchmarks.cs.tpl
  Benchmarks/BenchmarkSupport.cs: benchmarks/BenchmarkSupport.cs.tpl
  Benchmarks/Program.cs: benchmarks/Program.cs.tpl
  "Benchmarks/GrpcGen/{file}.proto": benchmarks/GrpcGen.proto.tpl

# {file} 为当前 proto 的文件名，不含扩展名。
# Tests/ 项目跟随测试开关；Benchmarks/ 项目跟随 benchmark 开关。
project:
  "{file}.csproj": project/main.csproj.tpl
  "Tests/{file}.Tests.csproj": project/tests.csproj.tpl
  "Benchmarks/{file}.Benchmarks.csproj": project/benchmarks.csproj.tpl
  Benchmarks/GrpcGen/GrpcGen.csproj: project/GrpcGen.csproj.tpl
  .gitignore: project/gitignore.tpl

# 公共子模板统一放 partials/，由生成器加载，无需逐个配置。
# RPC 使用独立目录；以下仅说明后续 QiWa.rpc/tpl_config.yaml 的简单映射，
# 不属于本数据类型配置，默认不生成 RPC；现有客户端草稿也不纳入。
# service: service/Server.cs.tpl
# rpc: method/Context.cs.tpl
